[project]
name = "scamroad"
version = "0.1.0"
description = "Edge AI pothole tracking system"
requires-python = ">=3.12"
readme = "README.md"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend/app", "ml", "edge"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "DTZ", "T20", "ICN", "PIE", "PT", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PGH", "PL", "TRY", "FLY", "PERF", "RUF"]
ignore = ["S101", "TRY003", "PLR0913", "PLR2004", "T201", "S105", "N802", "ARG001", "PLR0917", "B008", "TC001", "TC002", "TC003"]

[tool.ruff.lint.isort]
known-first-party = ["app", "ml", "edge"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["ultralytics.*", "cv2.*", "onnxruntime.*", "tflite_runtime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests", "ml/tests", "edge/tests", "shared/tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: integration tests requiring external services",
    "edge: edge device tests",
    "gpu: tests requiring GPU",
]

[tool.coverage.run]
source = ["backend/app", "ml", "edge"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
fail_under = 0
