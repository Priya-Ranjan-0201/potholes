# ─── Severity levels ──────────────────────────────────────────────────────
severity_levels:
  - range: [0, 25]
    level: Minor
    color: "#38A169"
  - range: [26, 50]
    level: Moderate
    color: "#D69E2E"
  - range: [51, 75]
    level: Severe
    color: "#DD6B20"
  - range: [76, 100]
    level: Critical
    color: "#E53E3E"
