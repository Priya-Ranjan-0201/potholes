name: ScamRoad CI

on:
  push:
    branches: [main, feat/*, fix/*, v7/*]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scamroad
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r backend/requirements.txt

      - name: Verify Claims & Traceability
        run: |
          python scripts/check_claims.py

      - name: Verify Multilingual i18n Key Parity
        run: |
          python scripts/check_i18n_keys.py

      - name: Run Ruff Lint
        run: |
          ruff check backend ml edge shared --config pyproject.toml

      - name: Run Pytest Suite
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          SECRET_KEY: test-ci-secret-key-at-least-32-chars-long!
        run: |
          pytest backend/tests shared/tests ml/tests edge/tests -v

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies
        run: |
          cd web
          npm ci

      - name: Run ESLint (ESLint 9 Flat Config)
        run: |
          cd web
          npm run lint

      - name: Strict TypeScript Compilation
        run: |
          cd web
          npx tsc --noEmit

      - name: Run Frontend Vitest Suite
        run: |
          cd web
          npm test

      - name: Production Vite Build
        run: |
          cd web
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint-and-test, frontend-quality]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: false
          tags: scamroad-api:test

      - name: Build Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: false
          tags: scamroad-web:test

