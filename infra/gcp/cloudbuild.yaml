# Google Cloud Build Pipeline for ScamRoad
steps:
  # 1. Pull cached container images
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: ['-c', 'docker pull gcr.io/$PROJECT_ID/scamroad-api:latest || exit 0']

  # 2. Build ScamRoad Backend API Container
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/scamroad-api:$COMMIT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/scamroad-api:latest',
      '-f', 'infra/docker/Dockerfile.api',
      '.'
    ]

  # 3. Run Test Suite inside Container
  - name: 'gcr.io/$PROJECT_ID/scamroad-api:$COMMIT_SHA'
    entrypoint: 'pytest'
    args: ['ml/tests/', 'backend/tests/', 'edge/tests/', 'shared/tests/']

  # 4. Push Image to Google Artifact Registry / Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/scamroad-api:$COMMIT_SHA']

images:
  - 'gcr.io/$PROJECT_ID/scamroad-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/scamroad-api:latest'

timeout: '1800s'
options:
  machineType: 'E2_HIGHCPU_8'
